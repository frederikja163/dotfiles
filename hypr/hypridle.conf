# hypridle — https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Timeline when idle:
#   5 min  dim the screen (restored on any input)
#  10 min  lock
#  12 min  turn the displays off
#  30 min  suspend
#
# Note: dispatchers must use Lua syntax here, because hyprland.lua is a Lua
# config. `hyprctl dispatch dpms off` silently fails; the quoted Lua form is
# required.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

# Dim the backlight, remembering the previous level.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# Lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Displays off.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Suspend on idle is deliberately not set up.
#
# Waking this machine is not reliable enough to do unattended: it only supports
# s2idle (`cat /sys/power/mem_sleep` offers no `deep`), the internal keyboard can
# wake it but the Dell dock's USB hubs have wakeup disabled, so a docked external
# keyboard cannot, and the power button is bound to poweroff rather than resume.
# Suspending is left to the power menu, where it is a deliberate choice.
#
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
