# hypridle — https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Timeline when idle:
#   5 min  dim the screen (restored on any input)
#  10 min  lock
#  12 min  turn the displays off
#  30 min  suspend
#
# Note: dispatchers must use Lua syntax here, because hyprland.lua is a Lua
# config. `hyprctl dispatch dpms off` silently fails; the quoted Lua form is
# required.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

# Dim the backlight, remembering the previous level.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# Lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Displays off.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# This machine never suspends, on idle or otherwise.
#
# It only supports s2idle (`cat /sys/power/mem_sleep` offers no `deep`), and
# resuming from it left the laptop's own panel permanently black. The routes in
# are closed off in system/90-no-suspend.conf (lid, sleep key) and bin/power-menu
# (no Suspend entry), so this file only dims, locks and blanks the screen.
#
# before_sleep_cmd and after_sleep_cmd above are kept as a safety net, in case
# something outside this config ever does put the machine to sleep.
