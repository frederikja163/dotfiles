# Desktop background: a slideshow of whatever is in ~/Pictures/backgrounds,
# or Hyprland's own default wallpaper when there is nothing there.
#
# The pictures are deliberately not in this repo. Each machine keeps its own,
# so the directory is created empty by install.sh and filled by hand; nothing
# links it anywhere.
#
# The fallback costs nothing to write because hyprpaper already behaves that
# way. A wallpaper whose path is missing, or is a directory holding no images,
# is logged and skipped, and with no wallpaper left hyprpaper draws no surface
# at all, so the compositor's default shows through (misc.force_default_wallpaper
# in look.lua). A launcher script that checked the directory first and only then
# started hyprpaper was considered and rejected: it would have had to agree with
# hyprpaper about what counts as an image, and hyprpaper asks libmagic as well
# as the extension, so a JPEG with no ".jpg" counts here but would not in a
# `find -name` test.
#
# The directory is read once, at startup -- verified in the 0.8.4 source, which
# lists it into a fixed array and never looks again. A picture added later
# turns up after `dotfiles-reload` (which restarts hyprpaper) or the next
# login. A single picture is simply shown; the timer only exists for two or
# more.
#
# One fallback entry (empty monitor) rather than one per screen, so a new
# screen gets the slideshow without being named here. Each screen runs its own
# timer over the same shuffled list.

wallpaper {
    monitor =
    path = ~/Pictures/backgrounds
    fit_mode = cover
    timeout = 300
    order = random
}
