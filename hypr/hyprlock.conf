# hyprlock — https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Catppuccin mocha, matching the rest of the setup.

general {
    hide_cursor = true
    ignore_empty_input = true
    # grace = 0 means it locks immediately with no unlock-without-password
    # window. Raise it if you want a few forgiving seconds.
    grace = 0
}

auth {
    pam {
        enabled = true
    }
}

background {
    monitor =
    # Blur the current screen contents rather than loading a wallpaper, so this
    # works before hyprpaper has a wallpaper configured.
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a6adc8ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2eff)
    font_color  = rgba(cdd6f4ff)
    check_color = rgba(f9e2afff)
    fail_color  = rgba(f38ba8ff)

    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password</span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>

    rounding = 10
    position = 0, -50
    halign = center
    valign = center
}
