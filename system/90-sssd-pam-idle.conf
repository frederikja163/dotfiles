# Let the lock screen keep its connection to sssd for as long as it is locked.
#
# This machine logs in against Active Directory through sssd, and hyprlock
# unlocks through PAM. hyprlock starts its PAM conversation the moment the
# screen locks, not when a password is typed, and pam_sss opens a socket to
# sssd for that conversation and holds it until the conversation ends. sssd's
# PAM responder hangs up on any client that stays silent for
# client_idle_timeout, 60 seconds by default, so a lock that has lasted longer
# than a minute has no connection left when the password finally arrives. The
# first attempt then comes back from pam_sss as "4 (System error)", which
# hyprlock shows as a wrong password, and never reaches Kerberos. The journal
# shows exactly that: `journalctl -t hyprlock` has a System error with no
# krb5_child line beside it, followed by a success. A lock of a few minutes
# did not show it, and kscreenlocker has the same report upstream.
#
# This raises the timeout to a week. The only client that sits idle on
# purpose is a lock screen, and a locked screen is the one thing here that
# can outlast any number chosen smaller. The cost is that a stuck PAM client
# holds one of sssd's file descriptors for longer, which is nothing next to
# the 8192 it is allowed.
#
# Not fixed by this: hyprlock 0.9.6 lets you type before it has started the
# next PAM conversation after a failure, so a password entered the instant
# the failure message appears can be cleared without a word. With the first
# attempt working that stops mattering, since it only follows a failure.
#
# sssd ignores a drop-in that is not owned by root with mode 0600, which is
# why install.sh installs this one with that mode, and it only reads the
# directory at startup, so it restarts sssd afterwards.
[pam]
client_idle_timeout = 604800
