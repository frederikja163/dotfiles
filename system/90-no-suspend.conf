# Never suspend this machine.
#
# It only supports s2idle (`cat /sys/power/mem_sleep` offers no `deep`), and
# resuming from it left the laptop's own panel permanently black. Rather than
# leave that as a trap, every route into suspend is turned off:
#
#   lid close   -> lock the session instead of suspending
#   sleep key   -> ignored
#   idle        -> hypr/hypridle.conf locks and blanks, but never suspends
#   power menu  -> has no Suspend entry
#
# HandlePowerKey is left alone: it powers off, which is what a long press
# should do.
[Login]
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
