# fuzzel — see fuzzel.ini(5)
#
# Chosen over hyprlauncher because it closes as soon as it loses keyboard
# focus, which is the default behaviour of keyboard-focus=exclusive. Do NOT
# pass --no-exit-on-keyboard-focus-loss, that turns the behaviour off.

[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=auto

# Layout
anchor=center
lines=15
width=45
horizontal-pad=24
vertical-pad=16
inner-pad=8

# Show icons from the same theme dunst uses.
icon-theme=Papirus-Dark

prompt=">  "
match-mode=fzf
layer=overlay

# exclusive = fuzzel holds keyboard focus and exits the moment it loses it.
keyboard-focus=exclusive

# This is the default, but it is the whole reason this launcher was chosen, so
# it is set explicitly to make it obvious if someone changes it later.
exit-on-keyboard-focus-loss=yes

[dmenu]
exit-immediately-if-empty=yes

[border]
width=2
radius=10

# --- theme: catppuccin mocha ----------------------------------------------
# Colors are RGBA hex without a leading 0x.
[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=b4befeff
placeholder=6c7086ff
input=cdd6f4ff
match=f38ba8ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f38ba8ff
counter=7f849cff
border=cba6f7ff
