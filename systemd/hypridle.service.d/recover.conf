# Layered over the hypridle.service the package ships, which already has
# Restart=on-failure. Linked to ~/.config/systemd/user/hypridle.service.d by
# install.sh.
#
# hypridle aborts now and then: an sdbus-c++ exception it does not catch, three
# core dumps since October (coredumpctl list hypridle). Started as a bare child
# of Hyprland it stayed dead, and what it leaves behind is the laptop screen
# black. The 5 minute dim had already written the backlight down to 10 of
# 192000, and the restore that undoes it runs from hypridle's on-resume, which
# a daemon that no longer exists never fires. Nothing said so; the screen was
# just black until the level was set by hand, with the external monitor still
# fine, which is why it looked like a panel fault.
#
# So two things. The unit is what restarts it (autostart.lua starts it through
# systemd, as it does dunst). And every start, the first one included, puts the
# screen back before the daemon begins: a hypridle that comes up fresh while the
# machine is already dimmed never sees an on-resume either, only a fresh idle
# timer, and would leave the screen black for another five minutes. Both are
# harmless on a clean start -- restore does nothing without a saved level, and
# waking a screen that is awake does nothing -- and the leading "-" keeps a
# failure of either from stopping hypridle itself coming up.
#
# RestartSec is longer than the default 100ms and the start limit is off. The
# default gives up for good after five restarts in ten seconds, which for a
# daemon that dies on a bus error is exactly the case where giving up is the
# worst answer; two seconds apart cannot become a busy loop instead.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=2
ExecStartPre=-%h/dotfiles/lib/screen-power restore
ExecStartPre=-%h/dotfiles/lib/screen-power wake
