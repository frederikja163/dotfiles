# kitty — https://sw.kovidgoyal.net/kitty/conf/
# Reload a running instance with ctrl+shift+f5.

# --- font ------------------------------------------------------------------
# Nerd Font variant so powerline glyphs and nvim's lspkind codicons render.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# The laptop panel (1920x1200) and the ultrawide (3440x1440) have noticeably
# different pixel densities. 11 is a compromise; ctrl+shift+= / - adjusts live.
font_size 11.0

# JetBrains Mono has ligatures. Keep them, but split them under the cursor so
# the character you are editing is unambiguous.
disable_ligatures cursor

# --- window ----------------------------------------------------------------
window_padding_width 8
confirm_os_window_close 0

# Slight transparency so hyprpaper shows through. 1.0 disables it.
background_opacity 0.95

# Hyprland does the tiling, so kitty's own splits are left alone deliberately.
# Only tabs are kept, and only on the keys that do not collide with nvim's
# ctrl+h/j/k/l window movement.
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# --- behaviour -------------------------------------------------------------
scrollback_lines 10000
copy_on_select    clipboard
enable_audio_bell no

# The prompt is pinned to the bottom row (see the precmd hook in zsh/.zshrc).
# Growing the window would otherwise append blank rows below it and unpin it,
# so pull the extra rows out of the scrollback at the top instead.
scrollback_fill_enlarged_window yes

# Open the current scrollback in nvim with ctrl+shift+h.
scrollback_pager nvim -c 'set ft=man' -

# --- theme: catppuccin mocha ----------------------------------------------
# Matches the colorscheme set in neovim/init.lua.
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #f5e0dc

active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

