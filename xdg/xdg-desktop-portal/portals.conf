# Which portal backend answers each request. The only change from what the
# hyprland-portals.conf shipped with xdg-desktop-portal-hyprland says is the
# FileChooser line: file open and save dialogs, which Brave (like any Chromium
# or GTK4 app) asks the portal for, go to xdg-desktop-portal-termfilechooser,
# and that runs yazi in a kitty window (see ../termfilechooser/config).
#
# Everything else keeps the distribution's answer, hyprland first and gtk as
# the fallback, because a user portals.conf replaces the system one outright
# rather than adding to it: leaving `default` out would drop screen sharing
# from the hyprland backend. Needs xdg-desktop-portal 1.18 or newer; this
# machine has 1.22.
#
# This is only right with termfilechooser installed, which packages/aur.txt
# declares: the line names a backend that has to exist.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=termfilechooser
